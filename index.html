<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 SMART 실전 전략 수첩</title>
    <style>
        :root { --메인: #e11d48; --포인트: #2563eb; --배경: #f1f5f9; --테두리: #e2e8f0; }
        body { font-family: 'Malgun Gothic', sans-serif; background: var(--배경); margin: 0; padding: 10px; color: #1e293b; }
        
        /* 보안 로그인 */
        #auth-section { margin: 100px auto; text-align: center; max-width: 350px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        input[type="password"] { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 70%; margin-bottom: 10px; font-size: 16px; outline: none; }
        .login-btn { padding: 12px 20px; background: var(--메인); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 80%; }

        #mainContent { max-width: 650px; margin: 0 auto; display: none; }
        .sticky-header { position: sticky; top: 0; background: var(--배경); z-index: 1000; padding: 10px 0; }
        .search-box { width: 100%; padding: 12px; border: 2px solid var(--테두리); border-radius: 10px; box-sizing: border-box; outline: none; }

        /* 카드 및 레이아웃 */
        .card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 25px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); border: 1px solid var(--테두리); }
        .section-title { font-size: 13px; font-weight: 800; background: #f8fafc; padding: 5px 10px; margin: 15px 0 8px 0; border-left: 4px solid #94a3b8; color: #334155; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .box { background: #f8fafc; padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; font-size: 12px; border: 1px solid #f1f5f9; align-items: center; }
        .label { color: #64748b; font-weight: bold; font-size: 11px; }
        .val { color: #1e293b; font-weight: bold; text-align: right; }
        .red { color: var(--메인); }
        .full { grid-column: span 2; }

        /* 사진 탭 및 리스트 */
        .card-photo-tabs { display: flex; overflow-x: auto; gap: 6px; margin: 10px 0; padding-bottom: 5px; }
        .p-btn { flex: 0 0 auto; padding: 4px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 15px; font-size: 11px; cursor: pointer; }
        .p-btn.active { background: var(--포인트); color: white; }
        .photo-list { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; min-height: 120px; }
        .photo-item { flex: 0 0 120px; height: 120px; border-radius: 10px; overflow: hidden; border: 1px solid #ddd; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }

        /* 비밀기록 전용 */
        .s-secret { background-color: #fcfaff; border-left: 4px solid #8b5cf6; padding: 12px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="auth-section">
        <h2>🔒 보안 수첩 접속</h2>
        <input type="password" id="pw" placeholder="비밀번호" onkeypress="if(event.key==='Enter') unlock()">
        <button class="login-btn" onclick="unlock()">열기</button>
    </div>

    <div id="mainContent">
        <div class="sticky-header">
            <input type="text" id="searchInput" class="search-box" placeholder="이름 또는 소속 검색..." onkeyup="runSearch()">
        </div>
        <div id="list"></div>
    </div>

<script>
    let masterDB = [];
    const subFolders = ['face', 'body', 'day', 'secret'];

    function unlock() {
        if (document.getElementById('pw').value === "1234") {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadData();
        } else { alert("비밀번호가 틀렸습니다."); }
    }

    async function loadData() {
        try {
            const res = await fetch('인명.csv');
            const ab = await res.arrayBuffer();
            let text = new TextDecoder('utf-8').decode(ab).replace(/^\uFEFF/, "");
            const rows = text.split(/\r?\n/).filter(r => r.trim() !== "").map(r => r.split(',').map(c => c.trim()));
            const header = rows[0];
            
            masterDB = rows.slice(1).map(r => {
                let obj = {};
                header.forEach((h, i) => obj[h] = r[i] || "");
                obj._imgs = [];
                subFolders.forEach(f => {
                    for(let i=1; i<=5; i++) obj._imgs.push({ path: `img/${obj['이름']}/${f}/${i}.jpg`, folder: f });
                });
                obj._currentTab = '전체';
                return obj;
            });
            runSearch();
        } catch (e) { alert("CSV 파일을 로드할 수 없습니다."); }
    }

    function setCardTab(idx, folder) {
        masterDB[idx]._currentTab = folder;
        renderCardPhotos(idx);
    }

    function renderCardPhotos(idx) {
        const p = masterDB[idx];
        const container = document.getElementById(`photos-${idx}`);
        const displayImgs = p._currentTab === '전체' ? p._imgs : p._imgs.filter(img => img.folder === p._currentTab);
        container.innerHTML = displayImgs.map(img => `
            <div class="photo-item"><img src="${img.path}" loading="lazy" onerror="this.parentElement.remove()"></div>
        `).join('');
    }

    function runSearch() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = "";

        masterDB.filter(p => p['이름'].includes(term) || p['소속'].includes(term)).forEach((p, idx) => {
            const getV = (key) => p[key] || "-";
            
            // 날짜 및 우선순위 계산
            const lastDate = new Date(getV('마지막본날'));
            const diffDays = Math.ceil(Math.abs(new Date() - lastDate) / (1000 * 60 * 60 * 24));
            const pColor = getV('우선순위') === '1' ? 'border: 3px solid #e11d48;' : 'border: 1px solid #e2e8f0;';
                <div class="card">
                    <div class="profile-row">
                        <div class="name-part"><span class="name">${getV('이름')}</span><span class="contact">${getV('연락처')}</span></div>
                        <div class="birth">${getV('생년월일')}</div>
                        <div class="belong">${getV('소속')}</div>
                    </div>

                    <div class="card-photo-tabs" id="tabs-${idx}"></div>
                    <div class="photo-list" id="photos-${idx}"></div>

                    <div class="section-title">📍 1. 기본 정보</div>
                    <div class="grid">
                        <div class="box full"><span class="label">주소</span><span class="val">${getV('주소')}</span></div>
                        <div class="box full"><span class="label">보유자료</span><span class="val">${getV('보유자료')}</span></div>
                        <div class="box"><span class="label">사이즈</span><span class="val red">${getV('사이즈')}</span></div>
                        <div class="box"><span class="label">관찰동기</span><span class="val">${getV('관찰동기')}</span></div>
                        <div class="box"><span class="label">첫만남</span><span class="val">${getV('첫만남')}</span></div>
                        <div class="box"><span class="label">첫스킨십</span><span class="val">${getV('첫스킨십')}</span></div>
                        <div class="box full"><span class="label">첫빠구리</span><span class="val">${getV('첫빠구리')}</span></div>
                    </div>

                    <div class="section-title">📈 2. 관계 상태 / 진행도</div>
                    <div class="grid">
                        <div class="box"><span class="label">진척도</span><span class="val red">${getV('진척도')}</span></div>
                        <div class="box"><span class="label">호감도</span><span class="val red">${getV('나에대한 호감도')}</span></div>
                        <div class="box"><span class="label">관계온도</span><span class="val red">${getV('관계온도')}</span></div>
                        <div class="box"><span class="label">최근수위</span><span class="val">${getV('최근수위')}</span></div>
                        <div class="box"><span class="label">최근고민</span><span class="val">${getV('최근고민')}</span></div>
                    </div>
                    <div class="box full relationship-memo">
                        <div style="width: 100%;">
                            <span class="label" style="display: block; margin-bottom: 5px;">📍 관계 현황 및 상세 설명</span>
                           <span class="val">${getV('관계설명')}</span>
            </div> </div>
                    <div class="section-title">🔥 3. 성향 / 취향</div>
                    <div class="grid">
                        <div class="box full"><span class="label">선호취향</span><span class="val">${getV('선호취향')}</span></div>
                        <div class="box full"><span class="label">특이사항</span><span class="val">${getV('특이사항')}</span></div>
                        <div class="box full"><span class="label">특이반응</span><span class="val">${getV('특이반응')}</span></div>
                    </div>

                    <!-- 4. 비밀 기록 및 미디어 섹션 -->
                    <div class="s-secret">
                        <div class="section-title">🔒 4. 시크릿 기록 & 미디어</div>
    
                        <div class="box full" style="margin-bottom: 10px; background: white;">
                            <span class="label">✍️ 은밀한 기록</span>
                            <span class="val" style="display:block; margin-top:5px; line-height:1.6; color:#4c1d95;">
                                ${getV('비밀기록')}
                            </span>
                        </div>

                        <div class="box full" style="background: white;">
                            <span class="label">📏 체형 특징</span>
                            <span class="val" style="display:block; margin-top:5px;">${getV('체형특징')}</span>
                        </div>

                        <!-- 몸사진 갤러리 (img/이름/body/ 폴더 안에 1.jpg, 2.jpg... 저장) -->
                        <div class="photo-grid">
                            <div class="photo-box">
                                <img src="img/${getV('이름')}/body/1.jpg" onerror="this.parentElement.style.display='none'">
                            </div>
                            <div class="photo-box">
                                <img src="img/${getV('이름')}/body/2.jpg" onerror="this.parentElement.style.display='none'">
                            </div>
                        </div>
                    </div>

                    <div class="section-title">⚠️ 5. 리스크 / 주의사항</div>
                    <div class="grid">
                        <div class="box full"><span class="label">주의사항</span><span class="val red">${getV('주의사항')}</span></div>
                        <div class="box full"><span class="label">경계인물</span><span class="val">${getV('경계인물')}</span></div>
                    </div>

                    <div class="section-title">💰 6. 접근성 / 운영 정보</div>
                    <div class="grid">
                        <div class="box"><span class="label">접근가능</span><span class="val">${getV('접근가능')}</span></div>
                        <div class="box"><span class="label">누적지출</span><span class="val">${getV('누적지출')}</span></div>
                        <div class="box full"><span class="label">가성비</span><span class="val">${getV('가성비')}</span></div>
                    </div>

                    <div class="section-title">🎯 7. 난이도 / 전략</div>
                    <div class="grid">
                        <div class="box"><span class="label">난이도</span><span class="val">${getV('난이도')}</span></div>
                        <div class="box full blue-memo"><strong>공략계획:</strong><br>${getV('공략계획')}</div>
                    </div>

                    <!-- 8. 공략 계획 섹션 -->
                    <div class="s-plan">
                        <div class="section-title">🎯 8. 맞춤형 공략 계획</div>
    
                        <div class="box full" style="margin-bottom: 10px; background: white;">
                            <span class="label">📍 현재 목표 단계</span>
                            <span class="val" style="font-weight: bold; color: #166534;">
                                ${getV('공략단계')}
                            </span>
                        </div>

                        <div class="box full" style="background: white;">
                            <span class="label">📋 세부 실행 아이템</span>
                            <div style="margin-top: 8px;">
                                ${getV('세부전략').split('/').map(item => `
                                    <div class="plan-item">
                                        <span class="plan-check">✔</span>
                                        <span>${item.trim()}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                        <!-- 🎯 9. 성과 중심 공략 섹션 -->
                        <div class="s6" style="${priorityStyle}">
                            <div class="section-title">🎯 집중 공략 및 성과 관리</div>
                            <div class="grid">
                                <div class="box full" style="background: #fff7ed;">
                                    <span class="label">🔥 다음 핵심 액션</span>
                                    <span class="val" style="color: #ea580c; font-size: 1.1em;">${getV('다음액션')}</span>
                                </div>
                                <div class="box">
                                    <span class="label">우선순위</span>
                                    <span class="val">${priority === '1' ? '⭐⭐⭐' : '⭐'}</span>
                                </div>
                                <div class="box">
                                    <span class="label">방치 기간</span>
                                    <span class="val" style="color: ${alertColor}">${diffDays}일째</span>
                                </div>
                                <div class="box full blue-memo">
                                    <strong>상세 공략 로드맵:</strong><br>
                                    ${getV('공략계획').split('/').map(step => `• ${step.trim()}`).join('<br>')}
                                </div>
                            </div>
                        </div>
                    <div class="section-title">⚙️ 10. 시스템 정보</div>
                    <div class="grid">
                        <div class="box full">
                            <span class="label">상세정보</span>
                            <span class="val">${getV('노션링크') !== '-' ? `<a href="${getV('노션링크')}" target="_blank" class="notion-btn">노션링크</a>` : '-'}</span>
                        </div>
                    </div>
                    <div class="footer-info">마지막 본날: ${getV('마지막본날')}</div>
                </div>`;
            
            container.insertAdjacentHTML('beforeend', cardHtml);
            renderCardPhotos(idx);
        });
    }
</script>
</body>
</html>
