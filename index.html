<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART 행동 기반 관리</title>

<style>
body { font-family: sans-serif; background:#f1f5f9; margin:0; padding:10px;}
.card { background:white; padding:15px; margin-bottom:15px; border-radius:12px; }
input, select { width:100%; padding:8px; margin-bottom:5px; }
button { padding:10px; width:100%; border:none; border-radius:8px; }
.save { background:#2563eb; color:white; }
.delete { background:#dc2626; color:white; margin-top:5px; }
.summary { background:#0f172a; color:white; padding:10px; border-radius:8px; margin-bottom:10px;}
</style>
</head>

<body>

<h2>📊 행동 기반 입력</h2>

<div class="card">
<input id="name" placeholder="이름">

<select id="responseSpeed">
<option>응답속도 선택</option>
<option>1시간 이내</option>
<option>당일</option>
<option>1일 이상</option>
</select>

<select id="responseLength">
<option>응답길이</option>
<option>짧음</option>
<option>보통</option>
<option>김</option>
</select>

<select id="initContact">
<option>먼저연락비율</option>
<option>높음</option>
<option>반반</option>
<option>낮음</option>
</select>

<input id="meetCount" type="number" placeholder="총 만남 횟수">

<select id="reject">
<option>최근 거절 여부</option>
<option>No</option>
<option>Yes</option>
</select>

<select id="risk1">
<option>불편반응 여부</option>
<option>No</option>
<option>Yes</option>
</select>

<select id="risk2">
<option>회피행동 여부</option>
<option>No</option>
<option>Yes</option>
</select>

<select id="risk3">
<option>경쟁요소 여부</option>
<option>No</option>
<option>Yes</option>
</select>

<button class="save" onclick="addData()">저장</button>
</div>

<div id="list"></div>

<script>

// 저장
function addData() {
    const data = {
        name: document.getElementById('name').value,
        responseSpeed: document.getElementById('responseSpeed').value,
        responseLength: document.getElementById('responseLength').value,
        initContact: document.getElementById('initContact').value,
        meetCount: parseInt(document.getElementById('meetCount').value) || 0,
        reject: document.getElementById('reject').value,
        risk1: document.getElementById('risk1').value,
        risk2: document.getElementById('risk2').value,
        risk3: document.getElementById('risk3').value,
        lastContact: new Date().toISOString()
    };

    let db = JSON.parse(localStorage.getItem('db') || '[]');
    db.push(data);
    localStorage.setItem('db', JSON.stringify(db));

    loadData();
}

// 점수 계산
function calculate(p) {
    let score = 0;
    let risk = 0;

    if (p.responseSpeed === "1시간 이내") score += 3;
    if (p.responseSpeed === "당일") score += 2;

    if (p.responseLength === "김") score += 2;

    if (p.initContact === "높음") score += 3;
    if (p.initContact === "반반") score += 1;

    if (p.meetCount >= 3) score += 2;

    if (p.reject === "Yes") score -= 4;

    if (p.risk1 === "Yes") risk += 3;
    if (p.risk2 === "Yes") risk += 3;
    if (p.risk3 === "Yes") risk += 2;

    const days = Math.floor((new Date() - new Date(p.lastContact)) / (1000*60*60*24));

    let stage = "";
    let action = "";

    if (risk >= 5) {
        stage = "⚠️ 관망";
        action = "접촉 줄이기 / 상황 관찰";
    } else if (score < 4) {
        stage = "🌱 초기";
        action = "가벼운 연락";
    } else if (score < 7) {
        stage = "🔥 강화";
        action = "3일 내 연락 / 만남 시도";
    } else {
        stage = "🚀 공략";
        action = "즉시 약속 제안";
    }

    return {score, risk, days, stage, action};
}

// 출력
function loadData() {
    const list = document.getElementById('list');
    list.innerHTML = "";

    let db = JSON.parse(localStorage.getItem('db') || '[]');

    db.forEach((p, i) => {
        const r = calculate(p);

        list.innerHTML += `
        <div class="card">
            <div class="summary">
                ${p.name} <br>
                ${r.stage} | 점수:${r.score} | ${r.days}일 경과 <br>
                👉 ${r.action}
            </div>

            응답속도: ${p.responseSpeed}<br>
            응답길이: ${p.responseLength}<br>
            먼저연락: ${p.initContact}<br>
            만남횟수: ${p.meetCount}<br>

            <button class="delete" onclick="deleteData(${i})">삭제</button>
        </div>
        `;
    });
}

// 삭제
function deleteData(i) {
    let db = JSON.parse(localStorage.getItem('db') || '[]');
    db.splice(i,1);
    localStorage.setItem('db', JSON.stringify(db));
    loadData();
}

loadData();
</script>

</body>
</html>
