<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 SMART 실전 전략 수첩</title>
    <style>
        :root { --메인: #e11d48; --포인트: #2563eb; --배경: #f1f5f9; --테두리: #e2e8f0; }
        body { font-family: 'Malgun Gothic', sans-serif; background: var(--배경); margin: 0; padding: 10px; color: #1e293b; line-height: 1.4; }
        
        /* 로그인 */
        #auth-section { margin: 100px auto; text-align: center; max-width: 350px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        input[type="password"] { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 70%; margin-bottom: 10px; font-size: 16px; outline: none; }
        .login-btn { padding: 12px 20px; background: var(--메인); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 80%; }

        #mainContent { max-width: 700px; margin: 0 auto; display: none; }
        .sticky-header { position: sticky; top: 0; background: var(--배경); z-index: 1000; padding: 10px 0; }
        .search-box { width: 100%; padding: 14px; border: 2px solid var(--테두리); border-radius: 12px; box-sizing: border-box; font-size: 16px; outline: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* 카드 레이아웃 */
        .card { background: white; border-radius: 18px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid var(--테두리); }
        
        /* 상단 프로필 영역 */
        .profile-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 15px; }
        .name-part { display: flex; align-items: baseline; gap: 10px; }
        .name { font-size: 1.8em; font-weight: 900; color: #000; }
        .contact { font-size: 1.1em; color: #475569; font-weight: bold; }
        .birth { font-size: 1em; color: #64748b; flex-grow: 1; text-align: center; }
        .belong { font-size: 1.1em; font-weight: bold; color: var(--포인트); }

        /* 사진 및 탭 */
        .card-photo-tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding: 5px 0; }
        .p-btn { flex: 0 0 auto; padding: 6px 15px; background: #fff; border: 1px solid #cbd5e1; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .p-btn.active { background: var(--포인트); color: white; border-color: var(--포인트); }
        
        .photo-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; min-height: 140px; }
        .photo-item { flex: 0 0 140px; width: 140px; height: 140px; border-radius: 12px; overflow: hidden; background: #f1f5f9; border: 1px solid #eee; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }

        /* 섹션별 구성 */
        .section-title { font-size: 14px; font-weight: 800; color: #334155; background: #f8fafc; padding: 6px 12px; margin: 18px 0 8px 0; border-radius: 6px; border-left: 4px solid #94a3b8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .box { padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 13px; align-items: center; border: 1px solid rgba(0,0,0,0.05); }
        .label { color: rgba(0,0,0,0.6); font-weight: bold; font-size: 12px; }
        .val { color: #1e293b; font-weight: bold; text-align: right; }
        .red { color: var(--메인) !important; }
        .full { grid-column: span 2; }

        /* [핵심] 섹션별 박스 색상 정의 */
        .s1 .box { background-color: #f0f9ff; border-color: #bae6fd; } /* 기본정보: 파랑 */
        .s1 .label { color: #0369a1; }
        
        .s2 .box { background-color: #fff1f2; border-color: #fecdd3; } /* 관계상태: 빨강 */
        .s2 .label { color: #9f1239; }

        .s3 .box { background-color: #f0fdf4; border-color: #bbf7d0; } /* 성향취향: 초록 */
        .s3 .label { color: #166534; }

        .s4 .box { background-color: #fffbeb; border-color: #fde68a; } /* 리스크: 노랑 */
        .s4 .label { color: #92400e; }

        .s5 .box { background-color: #faf5ff; border-color: #e9d5ff; } /* 접근성: 보라 */
        .s5 .label { color: #6b21a8; }

        .s6 .box { background-color: #fdf2f8; border-color: #fbcfe8; } /* 난이도: 핑크 */
        .s6 .label { color: #9d174d; }

        .s7 .box { background-color: #f8fafc; border-color: #e2e8f0; } /* 시스템: 회색 */
        .s7 .label { color: #475569; }

        .relationship-memo {
            background-color: #fff1f2 !important; /* 연한 핑크 배경 */
            border-left: 4px solid #e11d48 !important; /* 진한 빨강 포인트 */
            min-height: 60px;
            align-items: flex-start !important;
            padding: 12px !important;
        }

        .relationship-memo .val {
            text-align: left !important;
            display: block;
            line-height: 1.5;
            margin-top: 5px;
            color: #333;
            white-space: pre-wrap; /* 엑셀에서 줄바꿈한 것도 보이게 설정 */
        }

/* 공략 계획 섹션 스타일 */
.s-plan {
    background-color: #f0fdf4 !important; /* 연한 녹색 배경 (긍정적 진행) */

}

.plan-item {

.plan-check {

}

.guide-box {
    margin-top: 10px;

    padding: 8px 12px !important;
}
.small {
    font-size: 0.85em;

    color: #475569;
}

// 우선순위에 따른 카드 테두리 강조 로직
const priority = getV('우선순위');
const priorityStyle = priority === '1' ? 'border: 3px solid #e11d48;' : 'border: 1px solid #e2e8f0;';

// 날짜 계산 (마지막 만남 후 며칠 지났는지)
const lastDate = new Date(getV('마지막본날'));
const today = new Date();
const diffTime = Math.abs(today - lastDate);
const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
const alertColor = diffDays > 30 ? 'red' : 'green'; // 30일 이상 지나면 빨간색 표시

/* 상태 배지 공통 스타일 */
.status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    color: white; /* 글자색은 흰색으로 통일 */
    text-align: center;
    min-width: 60px;
}

/* 상태별 배경색 정의 (자바스크립트 클래스와 연동) */
.status-공략 {
    background-color: #ef4444; /* Vivid Red */
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
}

.status-관망 {
    background-color: #f59e0b; /* Amber/Orange */
}

.status-강화 {

}

/* 레이아웃 복구를 위한 핵심 CSS */
.card {
    display: flex;
    flex-direction: column; /* 요소를 위에서 아래로 정렬 */
    width: 100%;
    max-width: 450px; /* 카드의 적정 너비 고정 */
    margin: 0 auto 20px;
    padding: 15px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    box-sizing: border-box; /* 패딩이 너비를 넘지 않도록 설정 */
    overflow: hidden;
}

/* 모든 섹션을 블록화하여 강제로 줄바꿈 */
.s1, .s2, .s3, .s4, .s5, .s6, .s7, .s-secret, .s-plan, .metrics-container, .photo-container {
    display: block !important; 
    width: 100% !important;
    margin-bottom: 15px;
    clear: both; /* 주변 요소가 침범하지 못하게 함 */
}

/* 내부 그리드 시스템 안정화 */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2열 유지 */
    gap: 8px;
    width: 100%;
}

.box.full {
    grid-column: span 2; /* 전체 너비 사용 */
}

/* 텍스트가 넘칠 경우 대비 */
.val {
    word-break: break-all;
    white-space: normal;
}

        /* 기타 정보 */
        .blue-memo { background: rgba(255,255,255,0.5); border-left: 4px solid #0ea5e9; padding: 10px; font-size: 12px; border-radius: 4px; line-height: 1.5; margin-top: 5px;}
        .notion-btn { text-decoration: none; background: #000; color: white; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; }
        .footer-info { text-align: right; font-size: 11px; color: #94a3b8; margin-top: 15px; }

        ::-webkit-scrollbar { height: 5px; }

<body>

    <div id="auth-section">
        <h2>🔒 보안 수첩 접속</h2>
        <input type="password" id="pw" placeholder="비밀번호" onkeypress="if(event.key==='Enter') unlock()">
        <button class="login-btn" onclick="unlock()">열기</button>
    </div>

    <div id="mainContent">
        <div class="sticky-header">
            <input type="text" id="searchInput" class="search-box" placeholder="이름 또는 소속으로 검색..." onkeyup="runSearch()">
        </div>
        <div id="list"></div>
    </div>

<script>
let masterDB = [];
const subFolders = ['body', 'day', 'face', 'secret'];

window.onload = () => { document.getElementById('pw').focus(); };

/**
 * 비밀번호를 확인하고 메인 콘텐츠를 표시하는 함수
 */
/**
     * 1. 보안 해제 함수
     */
    function unlock() {
        const pwInput = document.getElementById('pw');
        const passwordValue = pwInput.value.trim();

        if (passwordValue === "1234") { // 비밀번호 설정
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            
            // 본 화면이 뜰 때 데이터를 로드하고 검색 실행
            if (typeof loadData === 'function') {
                loadData(); 
            } else {
                runSearch(); // 데이터가 이미 있다면 바로 실행
            }
        } else {
            alert("비밀번호가 틀렸습니다.");
            pwInput.value = "";
            pwInput.focus();
        }
    }

/**
 * 엔터 키 입력 시 자동으로 unlock 함수 호출
 */
document.getElementById('pw')?.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        unlock();
    }
});

async function loadData() {
    try {
        const res = await fetch('인명.csv');
        const ab = await res.arrayBuffer();
        let text = new TextDecoder('utf-8').decode(ab).replace(/^\uFEFF/, "");
        
        const rows = text.split(/\r?\n/).filter(row => row.trim() !== "").map(row => row.split(',').map(cell => cell.trim()));
        const header = rows[0].map(h => h.trim());
        
        masterDB = rows.slice(1).map(r => {
            let obj = {};
            header.forEach((h, i) => obj[h] = r[i] || "");
            
            obj._imgs = [];
            const name = (obj['이름'] || "").trim();

            // 1. CSV '사진목록' 컬럼 기반 경로 생성 (최우선)
            if (obj['사진목록'] && obj['사진목록'] !== "-") {
                const paths = obj['사진목록'].split('|');
                paths.forEach(p => {
                    const cleanPath = p.trim();
                    if (cleanPath) {
                        const folderName = cleanPath.split('/')[0]; 
                        obj._imgs.push({ 
                            path: `img/${name}/${cleanPath}`, 
                            folder: folderName 
                        });
                    }
                });
            } 
            // 2. 사진목록이 비어있을 때만 기본 하위 폴더에서 파일 탐색 (선택 사항)
            // 모든 사진이 40장으로 나오는게 싫으시면 이 else if 문 전체를 삭제하셔도 됩니다.
            else if (name) {
                // 여기에 반복문이 있으면 사진 장수가 고정되므로, 
                // 명확한 관리를 위해 사진목록 컬럼 사용을 권장합니다.
            }

            obj._currentTab = '전체';
            obj._isExpanded = false;
            return obj;
        });

        runSearch();
    } catch (e) { 
        console.error("로드 오류:", e);
    }
}

function renderCardPhotos(idx, showAll = false) {
    const p = masterDB[idx];
    const photoContainer = document.getElementById(`photos-${idx}`);
    if (!photoContainer) return;

    const tabContainer = document.getElementById(`tabs-${idx}`);
    const moreBtn = document.getElementById(`more-btn-${idx}`);

    if (showAll) {
        p._isExpanded = true;
        if (moreBtn) moreBtn.remove();
        if (tabContainer) tabContainer.style.display = 'flex';
        if (p._imgs.length > 0 && p._currentTab === '전체') {
            p._currentTab = p._imgs[0].folder;
        }
    }

    let targetImgs = p._imgs;
    if (p._isExpanded) {
        targetImgs = p._imgs.filter(img => img.folder === p._currentTab);
    }

    const displayImgs = p._isExpanded ? targetImgs : p._imgs.slice(0, 5);

    photoContainer.innerHTML = displayImgs.map(img => {
        const safePath = img.path.split('/').map(part => encodeURIComponent(part)).join('/');
        return `
            <div class="photo-item">
                <img src="${safePath}" loading="lazy" onerror="this.parentElement.style.display='none'">
            </div>
        `;
    }).join('');

    if (!p._isExpanded && p._imgs.length > 0 && !moreBtn) {
        photoContainer.insertAdjacentHTML('afterend', `
            <button id="more-btn-${idx}" class="p-btn" 
                    style="width:100%; margin: 10px 0; background:#f1f5f9; border-radius: 20px; font-weight: bold; color: #475569;" 
                    onclick="renderCardPhotos(${idx}, true)">
                📷 사진 폴더 분류 (${p._imgs.length}장)
            </button>
        `);
    }

    if (p._isExpanded) renderTabButtons(idx);
}

function getBehaviorStatus(p) {
    let score = 0, access = 0, risk = 0, status = "";

    // 1. 관계 점수 (행동 기반)
    if (p['응답속도'] === "1시간 이내") score += 3;
    else if (p['응답속도'] === "당일") score += 2;
    if (p['응답길이'] === "김") score += 2;
    if (p['먼저연락비율'] === "높음") score += 3;
    else if (p['먼저연락비율'] === "반반") score += 1;
    if (parseInt(p['총만남횟수']) >= 3) score += 2;
    if (p['최근거절여부'] === "Yes") score -= 4;

    // 2. 접근성 (날짜 차이 계산)
    const today = new Date();
    const diffContact = Math.ceil((today - new Date(p['최근연락일'])) / (1000 * 60 * 60 * 24));
    const diffMeeting = Math.ceil((today - new Date(p['최근만남일'])) / (1000 * 60 * 60 * 24));

    if (diffContact <= 3) access += 3;
    if (diffMeeting <= 7) access += 3;

    // 3. 리스크 점수
    if (p['불편반응'] === "Yes") risk += 3;
    if (p['회피행동'] === "Yes") risk += 3;
    if (p['경쟁요소'] === "Yes") risk += 2;

    // 4. 상태 자동 판단
    if (risk >= 5) status = "관망";
    else if (score < 4) status = "초기";
    else if (score < 7) status = "강화";
    else if (score >= 7 && access >= 5) status = "공략";
    else status = "대기";

    return { score, access, risk, status };
}

function renderTabButtons(idx) {
    const p = masterDB[idx];
    const tabContainer = document.getElementById(`tabs-${idx}`);
    // 실제 가지고 있는 폴더들만 탭으로 생성
    const folders = [...new Set(p._imgs.map(i => i.folder))];
    
    tabContainer.innerHTML = folders.map(f => `
        <button class="p-btn ${p._currentTab === f ? 'active' : ''}" 
                onclick="setCardTab(${idx}, '${f}')">${f}</button>
    `).join('');
}
function setCardTab(idx, folder) {
    masterDB[idx]._currentTab = folder;
    renderCardPhotos(idx);
}

/**
     * 2. 검색 및 카드 렌더링 함수 (레이아웃 완벽 보존)
     */
    function runSearch() {
        const searchInput = document.getElementById('searchInput');
        const term = searchInput ? searchInput.value.toLowerCase() : "";
        const container = document.getElementById('list');
        if (!container) return;
        
        container.innerHTML = ""; // 기존 리스트 초기화

        // 데이터 필터링
        const filtered = masterDB.filter(p => 
            (p['이름'] || '').includes(term) || (p['소속'] || '').includes(term)
        );

        filtered.forEach(p => {
            const idx = masterDB.indexOf(p);
            const getV = (key) => p[key] || "-";
            
            // 로직 계산 영역
            const calc = typeof getBehaviorStatus === 'function' ? getBehaviorStatus(p) : {status: '미정', score:0, access:0, risk:0};
            const priority = getV('우선순위');
            const priorityStyle = priority === '1' ? 'border: 3px solid #e11d48;' : 'border: 1px solid #e2e8f0;';
            
            const lastDateStr = getV('마지막본날');
            const lastDate = new Date(lastDateStr);
            const today = new Date();
            const diffDays = isNaN(lastDate) ? "-" : Math.ceil(Math.abs(today - lastDate) / (1000 * 60 * 60 * 24));
            const alertColor = diffDays > 7 ? '#e11d48' : '#16a34a';

            // [보존사항] S1 ~ S10 레이아웃 통합
            const cardHtml = `
                <div class="card" style="${priorityStyle}"></div>
                    <div class="profile-row"></div>
<div class="card" style="${priorityStyle}"></div>
        <!-- 상단 프로필 정보 -->
        <div class="profile-row">
            <div class="name-part"><span class="name">${getV('이름')}</span><span class="contact">${getV('연락처')}</span></div>
            <div class="birth">${getV('생년월일')}</div>
            <div class="belong">${getV('소속')}</div>
        </div>

        <!-- [추가된 내용] 객관화 지표 섹션: 사진과 기본 정보 사이의 핵심 수치 -->
        <div class="metrics-container" style="display: flex; justify-content: space-between; padding: 10px; background: #fff; border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px;">
            <div class="metric-item" style="text-align: center; flex: 1;">
                <div style="font-size: 10px; color: #666;">종합 호감 점수</div>
                <div style="font-size: 16px; font-weight: bold; color: #e11d48;">${calc.score}점</div>
            </div>
            <div class="metric-item" style="text-align: center; flex: 1; border-left: 1px solid #eee; border-right: 1px solid #eee;">
                <div style="font-size: 10px; color: #666;">접근성 지수</div>
                <div style="font-size: 16px; font-weight: bold; color: #2563eb;">${calc.access}%</div>
            </div>
            <div class="metric-item" style="text-align: center; flex: 1;">
                <div style="font-size: 10px; color: #666;">리스크 등급</div>
                <div style="font-size: 16px; font-weight: bold; color: ${calc.risk > 70 ? '#e11d48' : '#16a34a'};">
                    ${calc.risk > 70 ? '위험' : '안전'} (${calc.risk})
                </div>
            </div>
                    
<!-- [수정된 부분] 사진 섹션: 기본 정보(S1) 바로 위에 위치 -->
        <div class="photo-container" style="margin: 10px 0; padding: 10px; background: #f8fafc; border-radius: 8px;">
            <div class="card-photo-tabs" id="tabs-${idx}" style="display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px;">
                <!-- 탭 버튼이 생성될 곳 -->
            </div>
            <div class="photo-list" id="photos-${idx}" style="min-height: 50px;">
                <!-- 사진 이미지가 렌더링될 곳 -->
            </div>
        </div>

                    <!-- S1. 기본 정보 -->
                    <div class="s1">
                        <div class="section-title">📍 1. 기본 정보</div>
                        <div class="grid">
                            <div class="box full"><span class="label">주소</span><span class="val">${getV('주소')}</span></div>
                            <div class="box full"><span class="label">보유자료</span><span class="val">${getV('보유자료')}</span></div>
                            <div class="box"><span class="label">사이즈</span><span class="val red" style="color:red;">${getV('사이즈')}</span></div>
                            <div class="box"><span class="label">관찰동기</span><span class="val">${getV('관찰동기')}</span></div>
                            <div class="box"><span class="label">첫만남</span><span class="val">${getV('첫만남')}</span></div>
                            <div class="box"><span class="label">첫스킨십</span><span class="val">${getV('첫스킨십')}</span></div>
                            <div class="box full"><span class="label">첫빠구리</span><span class="val">${getV('첫빠구리')}</span></div>
                        </div>
                    </div>

                    <!-- S2. 관계 상태 -->
                    <div class="s2">
                        <div class="section-title">📈 2. 관계 상태 / 진행도</div>
                        <div class="grid">
                            <div class="box"><span class="label">진척도</span><span class="val red" style="color:red;">${getV('진척도')}</span></div>
                            <div class="box"><span class="label">호감도</span><span class="val red" style="color:red;">${getV('나에대한 호감도')}</span></div>
                            <div class="box"><span class="label">관계온도</span><span class="val red" style="color:red;">${getV('관계온도')}</span></div>
                            <div class="box"><span class="label">최근수위</span><span class="val">${getV('최근수위')}</span></div>
                            <div class="box"><span class="label">최근고민</span><span class="val">${getV('최근고민')}</span></div>
                            <div class="box full relationship-memo">
                                <div style="width: 100%;">
                                    <span class="label" style="display: block; margin-bottom: 5px;">📍 관계 현황 및 상세 설명</span>
                                    <span class="val" style="text-align: left; display: block; line-height: 1.5; color: #333;">${getV('관계설명')}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- S3. 성향 / 취향 -->
                    <div class="s3">
                        <div class="section-title">🔥 3. 성향 / 취향</div>
                        <div class="grid">
                            <div class="box full"><span class="label">선호취향</span><span class="val">${getV('선호취향')}</span></div>
                            <div class="box full"><span class="label">특이사항</span><span class="val">${getV('특이사항')}</span></div>
                            <div class="box full"><span class="label">특이반응</span><span class="val">${getV('특이반응')}</span></div>
                            <div class="box full guide-box">
                                <span class="label">💡 성향 기록 가이드</span>
                                <span class="val small">대화나 행동에서 나타나는 선호도와 민감도를 기록합니다.</span>
                            </div>
                        </div>
                    </div>

                    <!-- S4. 시크릿 기록 -->
                    <div class="s-secret">
                        <div class="section-title">🔒 4. 시크릿 기록 & 미디어</div>
                        <div class="box full" style="margin-bottom: 10px; background: white;">
                            <span class="label">✍️ 은밀한 기록</span>
                            <span class="val" style="display:block; margin-top:5px; line-height:1.6; color:#4c1d95;">${getV('비밀기록')}</span>
                        </div>
                        <div class="box full" style="background: white;">
                            <span class="label">📏 체형 특징</span>
                            <span class="val" style="display:block; margin-top:5px;">${getV('체형특징')}</span>
                        </div>
                    </div>

                    <!-- S5. 리스크 -->
                    <div class="s4">
                        <div class="section-title">⚠️ 5. 리스크 / 주의사항</div>
                        <div class="grid">
                            <div class="box full"><span class="label">주의사항</span><span class="val red" style="color:red;">${getV('주의사항')}</span></div>
                            <div class="box full"><span class="label">경계인물</span><span class="val">${getV('경계인물')}</span></div>
                        </div>
                    </div>

                    <!-- S6. 접근성 -->
                    <div class="s5">
                        <div class="section-title">💰 6. 접근성 / 운영 정보</div>
                        <div class="grid">
                            <div class="box"><span class="label">접근가능</span><span class="val">${getV('접근가능')}</span></div>
                            <div class="box"><span class="label">누적지출</span><span class="val">${getV('누적지출')}</span></div>
                            <div class="box full"><span class="label">가성비</span><span class="val">${getV('가성비')}</span></div>
                        </div>
                    </div>

                    <!-- S7~S9. 전략 및 공략 -->
                    <div class="s6">
                        <div class="section-title">🎯 7. 난이도 / 전략</div>
                        <div class="grid">
                            <div class="box"><span class="label">난이도</span><span class="val">${getV('난이도')}</span></div>
                            <div class="box full blue-memo"><strong>공략계획:</strong><br>${getV('공략계획')}</div>
                        </div>
                    </div>

                    <div class="s-plan">
                        <div class="section-title">🎯 8. 맞춤형 공략 계획</div>
                        <div class="box full" style="margin-bottom: 10px; background: white;">
                            <span class="label">📍 현재 목표 단계</span>
                            <span class="val" style="font-weight: bold; color: #166534;">${getV('공략단계')}</span>
                        </div>
                        <div class="box full" style="background: white;">
                            <span class="label">📋 세부 실행 아이템</span>
                            <div style="margin-top: 8px;">
                                ${getV('세부전략').split('/').map(item => `
                                    <div class="plan-item" style="display:flex; align-items:center; gap:5px; margin-bottom:3px;">
                                        <span class="plan-check" style="color:#16a34a;">✔</span>
                                        <span>${item.trim()}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="s6" style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
                        <div class="section-title">🚀 9. 집중 공략 관리</div>
                        <div class="grid">
                            <div class="box full" style="background: #fff7ed;">
                                <span class="label">🔥 다음 핵심 액션</span>
                                <span class="val" style="color: #ea580c; font-size: 1.1em;">${getV('다음액션')}</span>
                            </div>
                            <div class="box">
                                <span class="label">우선순위</span>
                                <span class="val">${priority === '1' ? '⭐⭐⭐' : '⭐'}</span>
                            </div>
                            <div class="box">
                                <span class="label">방치 기간</span>
                                <span class="val" style="color: ${alertColor}">${diffDays}일째</span>
                            </div>
                        </div>
                    </div>

                    <!-- S10. 시스템 정보 -->
                    <div class="s7">
                        <div class="section-title">⚙️ 10. 시스템 정보</div>
                        <div class="grid">
                            <div class="box full">
                                <span class="label">상세정보</span>
                                <span class="val">${getV('노션링크') !== '-' ? `<a href="${getV('노션링크')}" target="_blank" class="notion-btn" style="color:#2563eb; text-decoration:underline;">노션링크</a>` : '-'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="footer-info" style="margin-top:15px; font-size:11px; color:#666; text-align:right;">
                        마지막 본날: ${lastDateStr} (${diffDays}일 전)
                    </div>
                </div>`;
            
            container.insertAdjacentHTML('beforeend', cardHtml);
            
            // 사진 렌더링 (함수가 존재할 경우)
            if (typeof renderCardPhotos === 'function') {
                renderCardPhotos(idx);
            }
        });
    }

    // 엔터키 입력 시 비밀번호 확인 기능 추가
    document.getElementById('pw')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') unlock();
    });
</script>
</body>
</html>
